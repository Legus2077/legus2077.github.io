<script>
(function () {
  "use strict";

  var D;
  try {
    D = JSON.parse(document.getElementById("datos-sitio").textContent);
  } catch (e) {
    document.body.innerHTML = '<p style="padding:40px;color:#f87171;font-family:sans-serif;">Error al leer el contenido del sitio (bloque datos-sitio).</p>';
    return;
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function si(v) { return v != null && String(v).trim() !== ""; }
  function lista(v) { return Array.isArray(v) ? v.filter(si) : []; }
  function $(id) { return document.getElementById(id); }

  /* ---------- SEO dinámico ---------- */
  if (si(D.general.tituloPagina)) document.title = D.general.tituloPagina;
  (function () {
    var m = document.querySelector('meta[name="description"]');
    if (m && si(D.general.descripcion)) m.setAttribute("content", D.general.descripcion);
    if (si(D.general.imagen)) {
      var abs = /^https?:\/\//i.test(D.general.imagen)
        ? D.general.imagen
        : location.origin + "/" + D.general.imagen.replace(/^\.\//, "");
      ["og:image", "og:title", "og:description"].forEach(function (prop) {
        var el = document.querySelector('meta[property="' + prop + '"]');
        if (!el) return;
        if (prop === "og:image") el.setAttribute("content", abs);
        if (prop === "og:title") el.setAttribute("content", D.general.tituloPagina || document.title);
        if (prop === "og:description") el.setAttribute("content", D.general.descripcion || "");
      });
    }
  })();

  /* ---------- Encabezado ---------- */
  $("marca-nombre").textContent = D.general.nombre || "";
  $("nav-enlaces").innerHTML = lista(D.navegacion).map(function (n) {
    return '<a href="' + esc(n.enlace) + '">' + esc(n.texto) + "</a>";
  }).join("");

  var toggle = $("nav-toggle"), nav = $("nav");
  toggle.addEventListener("click", function () {
    var abierto = nav.classList.toggle("is-open");
    toggle.setAttribute("aria-expanded", abierto ? "true" : "false");
  });
  nav.addEventListener("click", function (ev) {
    if (ev.target.tagName === "A") nav.classList.remove("is-open");
  });

  /* ---------- Portada ---------- */
  (function () {
    var h = D.hero || {};
    var nombre = si(h.apellido)
      ? esc(h.nombre) + ' <span class="grad">' + esc(h.apellido) + "</span>"
      : esc(h.nombre);
    var botones = "";
    if (si(h.boton1 && h.boton1.texto)) {
      botones += '<a class="btn btn-primary" href="' + esc(h.boton1.enlace || "#") + '">' +
        '<span class="material-symbols-outlined">arrow_forward</span>' + esc(h.boton1.texto) + "</a>";
    }
    if (si(h.boton2 && h.boton2.texto)) {
      botones += '<a class="btn btn-ghost" href="' + esc(h.boton2.enlace || "#") + '">' + esc(h.boton2.texto) + "</a>";
    }

    $("hero-cont").innerHTML =
      '<div class="hero-text" data-reveal>' +
        (si(h.kicker)
          ? '<div class="status-pill"><span class="status-dot"></span><span>' + esc(h.kicker) + "</span></div>"
          : "") +
        "<h1>" + nombre + "</h1>" +
        (si(h.rol) ? '<p class="hero-role">' + esc(h.rol) + "</p>" : "") +
        (si(h.parrafo) ? '<p class="hero-desc">' + esc(h.parrafo) + "</p>" : "") +
        (botones ? '<div class="hero-actions">' + botones + "</div>" : "") +
      "</div>" +
      (si(h.retrato)
        ? '<figure class="hero-figure" data-reveal>' +
            '<div class="hero-float">' +
              '<div class="hero-tilt">' +
                '<img class="portrait" src="' + esc(h.retrato) + '" alt="Retrato profesional de ' + esc(D.general.nombre) + '">' +
                '<figcaption class="portrait-caption">' +
                  "<div>" +
                    '<div class="who">' + esc(D.general.nombre) + "</div>" +
                    (si(h.retratoCargo) ? '<div class="where">' + esc(h.retratoCargo) + "</div>" : "") +
                  "</div>" +
                "</figcaption>" +
              "</div>" +
            "</div>" +
          "</figure>"
        : "");
  })();

  /* ---------- Sobre mí ---------- */
  (function () {
    var s = D.sobre || {};
    var head =
      '<div class="section-head" data-reveal>' +
        (si(s.kicker) ? '<div class="kicker-line">' + esc(s.kicker) + "</div>" : "") +
        (si(s.titulo) ? "<h2>" + esc(s.titulo) + "</h2>" : "") +
      "</div>";

    var parrafos = lista(s.parrafos).map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
    var acciones = "";
    if (si(s.cv && s.cv.enlace)) {
      acciones += '<a class="btn btn-ghost" href="' + esc(s.cv.enlace) + '" target="_blank" rel="noreferrer">' +
        '<span class="material-symbols-outlined">download</span>' + esc(s.cv.texto || "Descargar CV") + "</a>";
    }
    if (si(s.nota)) {
      acciones += '<span class="about-note"><span class="material-symbols-outlined">verified_user</span>' + esc(s.nota) + "</span>";
    }

    var pilares = lista(s.pilares).filter(function (p) { return p.activo !== false; }).map(function (p) {
      return '<div class="pillar" data-reveal>' +
        '<div class="pillar-ico"><span class="material-symbols-outlined">' + esc(p.icono || "extension") + "</span></div>" +
        "<div><h4>" + esc(p.titulo) + "</h4>" +
        (si(p.texto) ? "<p>" + esc(p.texto) + "</p>" : "") +
        "</div></div>";
    }).join("");

    $("sobre-cont").innerHTML = head +
      '<div class="about-grid">' +
        '<div class="about-text" data-reveal>' +
          (si(s.frase) ? '<h3 class="about-frase">' + esc(s.frase) + "</h3>" : "") +
          parrafos +
          (acciones ? '<div class="about-actions">' + acciones + "</div>" : "") +
        "</div>" +
        (pilares ? '<div class="pillars">' + pilares + "</div>" : "") +
      "</div>";
  })();

  /* ---------- Proyectos ---------- */
  (function () {
    var p = D.proyectos || {};
    var head =
      '<div class="section-head" data-reveal>' +
        (si(p.kicker) ? '<div class="kicker-line">' + esc(p.kicker) + "</div>" : "") +
        (si(p.titulo) ? "<h2>" + esc(p.titulo) + "</h2>" : "") +
        (si(p.nota) ? '<p class="section-note">' + esc(p.nota) + "</p>" : "") +
      "</div>";

    var cards = lista(p.items).filter(function (x) { return x.activo !== false; }).map(function (x) {
      var links = "";
      if (si(x.demo)) {
        links += '<a class="link-btn" href="' + esc(x.demo) + '" target="_blank" rel="noreferrer">' +
          '<span class="material-symbols-outlined">visibility</span>Ver demo</a>';
      }
      if (si(x.codigo)) {
        links += '<a class="link-btn is-ghost" href="' + esc(x.codigo) + '" target="_blank" rel="noreferrer">' +
          '<span class="material-symbols-outlined">code</span>' + (si(x.demo) ? "Código" : "Repositorio") + "</a>";
      }
      var puntos = lista(x.puntos).map(function (t) {
        return '<li><span class="material-symbols-outlined">check_circle</span><span>' + esc(t) + "</span></li>";
      }).join("");
      var stack = lista(x.stack).map(function (t) {
        return '<span class="chip">' + esc(t) + "</span>";
      }).join("");

      return '<article class="project-card" data-reveal>' +
        '<div class="project-top">' +
          (si(x.dominio)
            ? '<span class="project-domain"><span class="material-symbols-outlined">' + esc(x.icono || "language") + "</span>" + esc(x.dominio) + "</span>"
            : '<span class="project-domain"><span class="material-symbols-outlined">' + esc(x.icono || "language") + "</span>" + esc(x.nombre) + "</span>") +
          (si(x.estado) ? '<span class="badge">' + esc(x.estado) + "</span>" : "") +
        "</div>" +
        '<div class="project-body">' +
          "<h3>" + esc(x.nombre) + "</h3>" +
          (si(x.descripcion) ? '<p class="project-desc">' + esc(x.descripcion) + "</p>" : "") +
          (puntos ? '<ul class="bullets">' + puntos + "</ul>" : "") +
          (stack ? '<div class="chips">' + stack + "</div>" : "") +
          (links ? '<div class="project-links">' + links + "</div>" : "") +
        "</div>" +
      "</article>";
    }).join("");

    $("proyectos-cont").innerHTML = head + '<div class="projects-grid">' + cards + "</div>";
  })();

  /* ---------- Proyectos personales ---------- */
  (function () {
    var p = D.personales || {};
    var items = lista(p.items).filter(function (x) { return x.activo !== false; });
    var seccion = document.getElementById("personales");

    /* Sin proyectos visibles: la sección entera no se muestra */
    if (!items.length) {
      if (seccion) seccion.style.display = "none";
      return;
    }

    var head =
      '<div class="section-head" data-reveal>' +
        (si(p.kicker) ? '<div class="kicker-line">' + esc(p.kicker) + "</div>" : "") +
        (si(p.titulo) ? "<h2>" + esc(p.titulo) + "</h2>" : "") +
        (si(p.nota) ? '<p class="section-note">' + esc(p.nota) + "</p>" : "") +
      "</div>";

    var cards = items.map(function (x) {
      var stack = lista(x.stack).map(function (t) {
        return '<span class="chip">' + esc(t) + "</span>";
      }).join("");
      var boton = si(x.enlace)
        ? '<a class="btn btn-primary btn-sm" href="' + esc(x.enlace) + '" target="_blank" rel="noreferrer">' +
            esc(x.textoBoton || "Ver proyecto") +
            '<span class="material-symbols-outlined">open_in_new</span></a>'
        : "";

      return '<article class="personal-card" data-reveal>' +
        '<div class="personal-ico"><span class="material-symbols-outlined">' + esc(x.icono || "rocket_launch") + "</span></div>" +
        '<div class="personal-body">' +
          '<div class="personal-meta">' +
            (si(x.tipo) ? '<span class="personal-tipo">' + esc(x.tipo) + "</span>" : "") +
            (si(x.anio) ? '<span class="personal-anio">' + esc(x.anio) + "</span>" : "") +
          "</div>" +
          "<h3>" + esc(x.titulo) + "</h3>" +
          (si(x.descripcion) ? "<p>" + esc(x.descripcion) + "</p>" : "") +
          (stack ? '<div class="chips">' + stack + "</div>" : "") +
        "</div>" +
        (boton ? '<div class="personal-accion">' + boton + "</div>" : "") +
      "</article>";
    }).join("");

    $("personales-cont").innerHTML = head + '<div class="personal-list">' + cards + "</div>";
  })();

  /* ---------- Habilidades ---------- */
  (function () {
    var s = D.skills || {};
    var head =
      '<div class="section-head" data-reveal>' +
        (si(s.kicker) ? '<div class="kicker-line">' + esc(s.kicker) + "</div>" : "") +
        (si(s.titulo) ? "<h2>" + esc(s.titulo) + "</h2>" : "") +
        (si(s.nota) ? '<p class="section-note">' + esc(s.nota) + "</p>" : "") +
      "</div>";

    var cards = lista(s.grupos).filter(function (g) { return g.activo !== false; }).map(function (g) {
      var tags = lista(g.tags).map(function (t) { return '<span class="chip">' + esc(t) + "</span>"; }).join("");
      /* El nivel va en la fila de etiquetas (que salta de línea) para que nunca desborde la tarjeta */
      var nivel = si(g.nivel) ? '<span class="skill-level">' + esc(g.nivel) + "</span>" : "";
      return '<div class="skill-card" data-reveal>' +
        '<div class="skill-head">' +
          '<span class="skill-ico"><span class="material-symbols-outlined">' + esc(g.icono || "extension") + "</span></span>" +
          "<h3>" + esc(g.titulo) + "</h3>" +
        "</div>" +
        (si(g.texto) ? "<p>" + esc(g.texto) + "</p>" : "") +
        ((nivel || tags) ? '<div class="chips">' + nivel + tags + "</div>" : "") +
      "</div>";
    }).join("");

    $("habilidades-cont").innerHTML = head + '<div class="skills-grid">' + cards + "</div>";
  })();

  /* ---------- Contacto ---------- */
  (function () {
    var c = D.contacto || {};
    var head =
      '<div class="section-head" data-reveal>' +
        (si(c.kicker) ? '<div class="kicker-line">' + esc(c.kicker) + "</div>" : "") +
        (si(c.titulo) ? "<h2>" + esc(c.titulo) + "</h2>" : "") +
      "</div>";

    var info = "";
    if (si(c.email)) {
      info += '<a class="info-item" href="mailto:' + esc(c.email) + '">' +
        '<span class="info-ico"><span class="material-symbols-outlined">mail</span></span>' +
        "<div><div class=\"info-label\">Email</div><div class=\"info-value\">" + esc(c.email) + "</div></div></a>";
    }
    if (si(c.telefono)) {
      info += '<a class="info-item" href="tel:' + esc((c.telefonoEnlace || c.telefono).replace(/\s+/g, "")) + '">' +
        '<span class="info-ico"><span class="material-symbols-outlined">call</span></span>' +
        "<div><div class=\"info-label\">Teléfono / WhatsApp</div><div class=\"info-value\">" + esc(c.telefono) + "</div></div></a>";
    }
    if (si(c.ubicacion)) {
      info += '<div class="info-item">' +
        '<span class="info-ico"><span class="material-symbols-outlined">location_on</span></span>' +
        "<div><div class=\"info-label\">Ubicación</div><div class=\"info-value\">" + esc(c.ubicacion) + "</div></div></div>";
    }

    var redes = lista(c.redes).filter(function (r) { return si(r.enlace); }).map(function (r) {
      return '<a class="social" href="' + esc(r.enlace) + '" target="_blank" rel="noreferrer">' +
        '<span class="material-symbols-outlined">' + esc(r.icono || "link") + "</span>" + esc(r.nombre) + "</a>";
    }).join("");

    $("contacto-cont").innerHTML = head +
      '<div class="contact-grid">' +
        '<div class="contact-info" data-reveal>' +
          (si(c.parrafo) ? '<p class="contact-lead">' + esc(c.parrafo) + "</p>" : "") +
          '<div class="info-list">' + info + "</div>" +
          (redes ? '<div class="socials">' + redes + "</div>" : "") +
        "</div>" +
        '<div class="form-card" data-reveal>' +
          '<h3><span class="material-symbols-outlined">send</span>Enviar mensaje</h3>' +
          '<form id="form-contacto" novalidate>' +
            '<div class="field"><label for="f-nombre">Nombre</label>' +
              '<input type="text" id="f-nombre" name="nombre" placeholder="Tu nombre" required></div>' +
            '<div class="field"><label for="f-email">Correo</label>' +
              '<input type="email" id="f-email" name="email" placeholder="tu@correo.com" required></div>' +
            '<div class="field"><label for="f-mensaje">Mensaje</label>' +
              '<textarea id="f-mensaje" name="mensaje" placeholder="Cuéntame brevemente qué necesitas…" required></textarea></div>' +
            '<div class="form-foot">' +
              '<span class="form-hint">Respuesta en menos de 24 h</span>' +
              '<button class="btn btn-primary" type="submit">' +
                '<span class="material-symbols-outlined">send</span>Enviar mensaje</button>' +
            "</div>" +
            '<div class="form-status" id="form-status" role="status"></div>' +
          "</form>" +
        "</div>" +
      "</div>";

    var form = $("form-contacto"), estado = $("form-status");
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var nombre = $("f-nombre").value.trim();
      var email = $("f-email").value.trim();
      var mensaje = $("f-mensaje").value.trim();
      estado.classList.remove("is-error");

      if (!nombre || !email || !mensaje) {
        estado.textContent = "Completa todos los campos.";
        estado.classList.add("is-error");
        return;
      }

      /* Sin endpoint configurado: abre el cliente de correo (nunca finge un envío) */
      if (!si(c.formspree)) {
        var asunto = "Mensaje desde tu portafolio — " + nombre;
        var cuerpo = mensaje + "\n\n— " + nombre + " (" + email + ")";
        window.location.href = "mailto:" + c.email +
          "?subject=" + encodeURIComponent(asunto) + "&body=" + encodeURIComponent(cuerpo);
        estado.textContent = "Se abrió tu aplicación de correo con el mensaje listo para enviar.";
        return;
      }

      estado.textContent = "Enviando…";
      fetch(c.formspree, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ nombre: nombre, email: email, mensaje: mensaje })
      })
        .then(function (r) {
          if (!r.ok) throw new Error("No se pudo enviar");
          estado.textContent = "✓ Mensaje enviado. Te responderé pronto.";
          form.reset();
        })
        .catch(function () {
          estado.textContent = "No se pudo enviar. Escríbeme a " + c.email + ".";
          estado.classList.add("is-error");
        });
    });
  })();

  /* ---------- Pie ---------- */
  (function () {
    var estado = D.general.disponible
      ? '<span class="footer-status"><span class="status-dot"></span>' + esc(D.general.disponibleTexto || "Disponible") + "</span>"
      : "";
    var enlaces = lista(D.navegacion).map(function (n) {
      return '<a href="' + esc(n.enlace) + '">' + esc(n.texto) + "</a>";
    }).join("");
    $("footer-cont").innerHTML =
      '<div class="footer-left">' + estado +
        '<span class="footer-copy">' + esc((D.contacto && D.contacto.copyright) || "") + "</span>" +
      "</div>" +
      '<div class="footer-links">' + enlaces + "</div>";
  })();

  /* ---------- Animación de aparición ---------- */
  (function () {
    var items = Array.prototype.slice.call(document.querySelectorAll("[data-reveal]"));
    if (!items.length) return;

    /* Respaldo: revela lo que ya está en pantalla sin depender del observador */
    function revelarVisibles() {
      items.forEach(function (el) {
        if (el.classList.contains("is-visible")) return;
        var r = el.getBoundingClientRect();
        if (r.top < (window.innerHeight || 0) && r.bottom > 0) el.classList.add("is-visible");
      });
    }

    if (!("IntersectionObserver" in window)) {
      items.forEach(function (el) { el.classList.add("is-visible"); });
      return;
    }

    var obs = new IntersectionObserver(function (entradas) {
      entradas.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add("is-visible"); obs.unobserve(e.target); }
      });
    }, { threshold: 0.12 });
    items.forEach(function (el) { obs.observe(el); });

    revelarVisibles();
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) revelarVisibles();
    });
    window.addEventListener("pageshow", revelarVisibles);
  })();

  /* ---------- Retrato 3D (inclinación que sigue al puntero) ---------- */
  (function () {
    var figura = document.querySelector(".hero-tilt");
    var zona = document.querySelector(".hero");
    if (!figura || !zona) return;

    var neutro = "perspective(1000px) rotateX(0deg) rotateY(0deg)";

    /* Se comprueba en cada evento: si el usuario cambia la opción en el sistema, se respeta */
    function permitido() {
      if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return false;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return false;
      return true;
    }

    zona.addEventListener("pointermove", function (ev) {
      if (!permitido()) return;
      var r = figura.getBoundingClientRect();
      if (!r.width || !r.height) return;
      var dx = (ev.clientX - (r.left + r.width / 2)) / (window.innerWidth / 2);
      var dy = (ev.clientY - (r.top + r.height / 2)) / (window.innerHeight / 2);
      dx = Math.max(-1, Math.min(1, dx));
      dy = Math.max(-1, Math.min(1, dy));
      figura.style.transform =
        "perspective(1000px)" +
        " rotateX(" + (-dy * 9).toFixed(2) + "deg)" +  /* cursor arriba → la foto mira arriba */
        " rotateY(" + (dx * 13).toFixed(2) + "deg)";   /* cursor a la derecha → gira a la derecha */
    });

    zona.addEventListener("pointerleave", function () {
      figura.style.transform = neutro;
    });
  })();
})();
</script>

</body>
</html>
